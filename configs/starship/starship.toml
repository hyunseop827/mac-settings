"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
palette = 'neon_void'

format = """
[](cyan)\
$os\
$username\
$hostname\
[](bg:magenta fg:cyan)\
$directory\
[](bg:green fg:magenta)\
$git_branch\
$git_status\
[](fg:green bg:blue)\
$c\
$custom\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:blue bg:yellow)\
$docker_context\
$conda\
[ ](fg:yellow)\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "bg:cyan fg:crust"
format = '[ ]($style)'

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:cyan fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user ]($style)'
disabled = false

[hostname]
ssh_only = true
trim_at = ".local"
style = "bg:cyan fg:crust"
format = '[@$hostname ]($style)'
disabled = false

[directory]
style = "bg:magenta fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = ".../"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:green fg:crust"
format = '[[ $symbol $branch ](fg:crust bg:green)]($style)'

[git_status]
style = "bg:green fg:crust"
format = '[[($all_status$ahead_behind )](fg:crust bg:green)]($style)'

[nodejs]
symbol = ""
style = "bg:blue fg:crust"
format = '[[ $symbol( $version) ](fg:crust bg:blue)]($style)'

[bun]
symbol = ""
style = "bg:blue fg:crust"
format = '[[ $symbol( $version) ](fg:crust bg:blue)]($style)'

[c]
symbol = " "
style = "bg:blue fg:crust"
format = '[[ $symbol( $version) ](fg:crust bg:blue)]($style)'
detect_extensions = ["c"]

[custom.objc]
symbol = " "
style = "bg:blue fg:crust"
format = '[[ $symbol($output) ](fg:crust bg:blue)]($style)'
command = "clang --version | awk 'NR == 1 { print \"v\" $4 }'"
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1 && git ls-files --cached --others --exclude-standard \"*.m\" \"*.mm\" | grep -q ."

[rust]
symbol = ""
style = "bg:blue fg:crust"
format = '[[ $symbol( $version) ](fg:crust bg:blue)]($style)'

[golang]
symbol = ""
style = "bg:blue fg:crust"
format = '[[ $symbol( $version) ](fg:crust bg:blue)]($style)'

[php]
symbol = ""
style = "bg:blue fg:crust"
format = '[[ $symbol( $version) ](fg:crust bg:blue)]($style)'

[java]
symbol = " "
style = "bg:blue fg:crust"
format = '[[ $symbol( $version) ](fg:crust bg:blue)]($style)'

[kotlin]
symbol = ""
style = "bg:blue fg:crust"
format = '[[ $symbol( $version) ](fg:crust bg:blue)]($style)'

[haskell]
symbol = ""
style = "bg:blue fg:crust"
format = '[[ $symbol( $version) ](fg:crust bg:blue)]($style)'

[python]
symbol = ""
style = "bg:blue fg:crust"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:blue)]($style)'

[docker_context]
symbol = ""
style = "bg:yellow fg:crust"
format = '[[ $symbol( $context) ](fg:crust bg:yellow)]($style)'

[conda]
symbol = "  "
style = "fg:crust bg:yellow"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = true
time_format = "%R"
style = "bg:gray fg:text"
format = '[[  $time ](fg:text bg:gray)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:cyan)'
vimcmd_replace_one_symbol = '[❮](bold fg:magenta)'
vimcmd_replace_symbol = '[❮](bold fg:magenta)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
min_time = 1
show_milliseconds = true
format = " in $duration "
style = "fg:gray"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[palettes.neon_void]
crust = "#050609"
text = "#d7e1e8"
red = "#e85d75"
green = "#72d98f"
yellow = "#d6b86a"
blue = "#6aa9e8"
magenta = "#a875d6"
cyan = "#28c7d4"
gray = "#3c4352"
bright_red = "#f07f93"
bright_green = "#98e8ad"
bright_yellow = "#e3ca86"
bright_blue = "#8fc0f0"
bright_magenta = "#bf96e4"
bright_cyan = "#66dce3"
white = "#ffffff"
